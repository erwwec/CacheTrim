name: Build and publish CacheTrim

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained WPF app
        shell: powershell
        run: |
          dotnet publish .\wpf\CacheTrim.Wpf.csproj -c Release -r win-x64 -p:Platform=x64 -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -o .\dist\publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed: $LASTEXITCODE" }
          Copy-Item .\dist\publish\CacheTrim.exe .\dist\CacheTrim.exe -Force

      - name: Publish Desktop Pet companion
        shell: powershell
        run: |
          dotnet publish .\companion\DesktopPet\DesktopPet.csproj -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -o .\dist\pet-publish
          if ($LASTEXITCODE -ne 0) { throw "Desktop Pet publish failed: $LASTEXITCODE" }
          Copy-Item .\dist\pet-publish\DesktopPet.exe .\dist\DesktopPet.exe -Force

      - name: Create SHA-256 checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash .\dist\CacheTrim.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path .\dist\CacheTrim.exe.sha256 -Value $hash -NoNewline -Encoding ASCII
          $petHash = (Get-FileHash .\dist\DesktopPet.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path .\dist\DesktopPet.exe.sha256 -Value $petHash -NoNewline -Encoding ASCII

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/CacheTrim.exe
            dist/CacheTrim.exe.sha256
            dist/DesktopPet.exe
            dist/DesktopPet.exe.sha256
