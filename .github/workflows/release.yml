name: Build and publish CacheTrim

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build with the Windows Framework compiler
        shell: powershell
        run: .\build.ps1

      - name: Create SHA-256 checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash .\dist\CacheTrim.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path .\dist\CacheTrim.exe.sha256 -Value $hash -NoNewline -Encoding ASCII

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/CacheTrim.exe
            dist/CacheTrim.exe.sha256
