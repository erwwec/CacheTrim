name: Verify Windows build

on:
  push:
    branches: [main, 'test/claude-v2-voice', 'test/claude-v2-window', 'fix/liquid-glass-wpf', 'fix/update-history-safety', 'feat/safe-cleanup-lyrics', 'feat/offline-pet-progress', 'fix/update-progress-notices', 'feat/system-insights', 'fix/diagnostics-design', 'feat/claude-slider-v2', 'feat/claude-custom-commands', 'feat/commands-redesign', 'feat/commands-actions']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and smoke-test Desktop Pet
        shell: pwsh
        run: |
          dotnet publish .\companion\DesktopPet\DesktopPet.csproj -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -o .\dist\pet-publish
          if ($LASTEXITCODE -ne 0) { throw 'Desktop Pet publish failed' }
          .\tests\SmokePet.ps1

      - name: Check separate assistant window and sizes
        shell: pwsh
        run: .\tests\SmokePetAssistant.ps1

      - name: Publish Windows executable
        shell: pwsh
        run: |
          $petHash = (Get-FileHash .\dist\pet-publish\DesktopPet.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          dotnet publish .\wpf\CacheTrim.Wpf.csproj -c Release -r win-x64 -p:Platform=x64 -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false "-p:TrustedDesktopPetSha256=$petHash" -o .\dist\verify
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
      - name: Verify embedded pet integrity pin
        shell: pwsh
        run: |
          $petHash = (Get-FileHash .\dist\pet-publish\DesktopPet.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $assembly = '.\wpf\obj\x64\Release\net10.0-windows10.0.19041.0\win-x64\CacheTrim.dll'
          dotnet run --project .\tests\BuildPinTests\BuildPinTests.csproj -c Release -- $assembly $petHash
          if ($LASTEXITCODE -ne 0) { throw 'App does not pin this build of Desktop Pet' }
      - name: Check update-notes detection on Windows
        shell: pwsh
        run: |
          dotnet run --project .\tests\WhatsNewTests\WhatsNewTests.csproj -c Release -- .\dist\verify\CacheTrim.exe
          if ($LASTEXITCODE -ne 0) { throw 'Update-notes checks failed' }
      - name: Check update dialog appears
        shell: pwsh
        run: .\tests\SmokeWhatsNew.ps1
      - name: Check Desktop Acrylic backdrop
        shell: pwsh
        run: .\tests\SmokeGlass.ps1
      - name: Check tool dashboard structure
        if: github.ref == 'refs/heads/fix/diagnostics-design'
        shell: pwsh
        run: .\tests\SmokeToolsDashboard.ps1
      - name: Test WPF glass frame setup
        shell: pwsh
        run: |
          dotnet run --project .\tests\GlassFrameTests\GlassFrameTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'WPF glass frame test failed' }
      - name: Test read-only system insights formatting
        shell: pwsh
        run: |
          dotnet run --project .\tests\SystemInsightsTests\SystemInsightsTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'System insights checks failed' }
      - name: Test process safety boundaries
        shell: pwsh
        run: |
          dotnet run --project .\tests\ProcessManagerTests\ProcessManagerTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Process safety checks failed' }
      - name: Test package catalog argument safety
        shell: pwsh
        run: |
          dotnet run --project .\tests\PackageCatalogTests\PackageCatalogTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Package catalog checks failed' }
      - name: Test game library safety
        shell: pwsh
        run: |
          dotnet run --project .\tests\GameLibraryTests\GameLibraryTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Game library checks failed' }
      - name: Test game capture analysis
        shell: pwsh
        run: |
          dotnet run --project .\tests\GameCaptureTests\GameCaptureTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Game capture analysis failed' }
      - name: Test process affinity backup safeguards
        shell: pwsh
        run: |
          dotnet run --project .\tests\ProcessAffinityTests\ProcessAffinityTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Affinity checks failed' }
      - name: Test cleanup boundaries
        shell: pwsh
        run: |
          dotnet run --project .\tests\CleanerSafetyTests\CleanerSafetyTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Cleaner safety tests failed' }

      - name: Test safe companion restart
        shell: pwsh
        run: |
          dotnet run --project .\tests\CompanionRestartTests\CompanionRestartTests.csproj -c Release -- .\dist\pet-publish\DesktopPet.exe
          if ($LASTEXITCODE -ne 0) { throw 'Companion restart test failed' }
      - name: Test pet reminders and autostart policy
        shell: pwsh
        run: |
          dotnet run --project .\tests\PetPolicyTests\PetPolicyTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Pet policy tests failed' }
      - name: Test synchronized lyrics timing
        shell: pwsh
        run: |
          dotnet run --project .\tests\LyricsTests\LyricsTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Lyrics timing tests failed' }
      - name: Test file review scans
        shell: pwsh
        run: |
          dotnet run --project .\tests\FileReviewTests\FileReviewTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'File review tests failed' }
      - name: Test cleanup configuration safety
        shell: pwsh
        run: |
          dotnet run --project .\tests\ConfigSafetyTests\ConfigSafetyTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Cleanup configuration safety tests failed' }
      - name: Test cleanup schedule definition
        shell: pwsh
        run: |
          dotnet run --project .\tests\TaskSetupTests\TaskSetupTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Schedule definition tests failed' }
      - name: Test cleanup presets
        shell: pwsh
        run: |
          dotnet run --project .\tests\CleanupPresetsTests\CleanupPresetsTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Cleanup preset tests failed' }
      - name: Test network diagnostics input
        shell: pwsh
        run: |
          dotnet run --project .\tests\NetworkDiagnosticsTests\NetworkDiagnosticsTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Network diagnostics input tests failed' }
      - name: Test display diagnostics filtering
        shell: pwsh
        run: |
          dotnet run --project .\tests\DisplayDiagnosticsTests\DisplayDiagnosticsTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Display diagnostics tests failed' }
      - name: Test V2 cloud assistant safeguards
        shell: pwsh
        run: |
          dotnet run --project .\tests\CloudAssistantTests\CloudAssistantTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Cloud assistant safeguards failed' }
      - name: Test bundled Russian voice model
        shell: pwsh
        run: |
          $nugetRoot = if ($env:NUGET_PACKAGES) { $env:NUGET_PACKAGES } else { Join-Path $env:USERPROFILE '.nuget\packages' }
          $env:PATH = (Join-Path $nugetRoot 'vosk\0.3.38\build\lib\win-x64') + ';' + $env:PATH
          dotnet run --project .\tests\OfflineSpeechTests\OfflineSpeechTests.csproj -c Release -- .\dist\pet-publish\VoiceModel\vosk-model-small-ru-0.22
          if ($LASTEXITCODE -ne 0) { throw 'Bundled speech model test failed' }
      - name: Test user-defined command validation and persistence
        shell: pwsh
        run: |
          dotnet run --project .\tests\CustomCommandTests\CustomCommandTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Custom command safety tests failed' }
      - name: Test custom action execution on Windows
        shell: pwsh
        run: |
          dotnet run --project .\tests\CustomActionWindowsTests\CustomActionWindowsTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Custom action execution tests failed' }
      - name: Test V2 assistant command allowlist
        shell: pwsh
        run: |
          dotnet run --project .\tests\VoiceCommandTests\VoiceCommandTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'V2 command tests failed' }
      - name: Test pet speech bubble state
        shell: pwsh
        run: |
          dotnet run --project .\tests\PetUiTests\PetUiTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Pet speech bubble tests failed' }
      - name: Test update download safety
        shell: pwsh
        run: |
          dotnet run --project .\tests\UpdateSafetyTests\UpdateSafetyTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Update safety tests failed' }
      - name: Package experimental build for manual testing
        if: github.ref == 'refs/heads/feat/system-insights' || github.ref == 'refs/heads/fix/diagnostics-design'
        shell: pwsh
        run: |
          $out = '.\dist\experimental-test'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item .\dist\verify\CacheTrim.exe $out
          Copy-Item .\dist\pet-publish\DesktopPet.exe $out
          Copy-Item .\dist\pet-publish\VoiceModel $out -Recurse
          $nugetRoot = if ($env:NUGET_PACKAGES) { $env:NUGET_PACKAGES } else { Join-Path $env:USERPROFILE '.nuget\packages' }
          $native = Join-Path $nugetRoot 'vosk\0.3.38\build\lib\win-x64'
          foreach ($name in @('libvosk.dll', 'libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll')) {
            $file = Join-Path $native $name
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing Vosk dependency: $name" }
            Copy-Item -LiteralPath $file -Destination $out
          }
          foreach ($name in @('CacheTrim.exe', 'DesktopPet.exe')) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $out $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath (Join-Path $out ($name + '.sha256')) -Value $hash -NoNewline -Encoding ASCII
          }
          @'
          ЭКСПЕРИМЕНТАЛЬНАЯ ТЕСТОВАЯ СБОРКА — не официальный выпуск и не обновление через программу.
          Дизайн инструментов и новые функции не испытаны на реальном ПК; сначала тестируйте на виртуальной машине или отдельной тестовой учётной записи без важных данных.
          Программа запрашивает права администратора. Установка и удаление программ, процессы и настройки CPU могут затронуть данные и работу системы.
          Не заменяйте установленную рабочую копию. Сохраните оба EXE рядом. Для голоса запускайте DesktopPet.exe напрямую и храните DLL и VoiceModel рядом.
          Экспериментальный мониторинг требует отдельного официального PresentMon 2.6.0 x64. Проверка хеша EXE не проверяет DLL и модель.
          Онлайн-рейтинг, настройки прерываний, эксклюзивное резервирование ядер и готовые профили отдельных игр не реализованы.
          '@ | Set-Content -LiteralPath (Join-Path $out 'ПРОЧИТАЙ-МЕНЯ.txt') -Encoding UTF8
      - name: Upload experimental build artifact
        if: github.ref == 'refs/heads/feat/system-insights' || github.ref == 'refs/heads/fix/diagnostics-design'
        uses: actions/upload-artifact@v4
        with:
          name: CacheTrim-experimental-${{ github.sha }}
          path: dist/experimental-test/
          if-no-files-found: error
          retention-days: 14

  visual-preview:
    if: (github.ref == 'refs/heads/feat/commands-redesign' || github.ref == 'refs/heads/feat/commands-actions') && github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Render the actual command editor with example data
        shell: pwsh
        run: |
          dotnet run --project .\tests\CommandEditorPreview\CommandEditorPreview.csproj -c Release -- docs/previews/custom-commands.png
          if ($LASTEXITCODE -ne 0) { throw 'Preview failed' }
      - name: Commit preview image
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/previews/custom-commands.png
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Add command editor preview [skip ci]'
            if ($LASTEXITCODE -ne 0) { throw 'Preview commit failed' }
            git push origin "HEAD:$env:TARGET_BRANCH"
            if ($LASTEXITCODE -ne 0) { throw 'Preview push failed' }
          }
