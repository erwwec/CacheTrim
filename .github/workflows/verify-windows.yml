name: Verify Windows build

on:
  push:
    branches: [main, 'fix/liquid-glass-wpf', 'fix/update-history-safety', 'feat/safe-cleanup-lyrics']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Windows executable
        shell: pwsh
        run: |
          dotnet publish .\wpf\CacheTrim.Wpf.csproj -c Release -r win-x64 -p:Platform=x64 -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -o .\dist\verify
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
      - name: Check update-notes detection on Windows
        shell: pwsh
        run: |
          dotnet run --project .\tests\WhatsNewTests\WhatsNewTests.csproj -c Release -- .\dist\verify\CacheTrim.exe
          if ($LASTEXITCODE -ne 0) { throw 'Update-notes checks failed' }
      - name: Check update dialog appears
        shell: pwsh
        run: .\tests\SmokeWhatsNew.ps1
      - name: Check Desktop Acrylic backdrop
        shell: pwsh
        run: .\tests\SmokeGlass.ps1
      - name: Test cleanup boundaries
        shell: pwsh
        run: |
          dotnet run --project .\tests\CleanerSafetyTests\CleanerSafetyTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Cleaner safety tests failed' }
      - name: Build and smoke-test Desktop Pet
        shell: pwsh
        run: |
          dotnet publish .\companion\DesktopPet\DesktopPet.csproj -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -o .\dist\pet-publish
          if ($LASTEXITCODE -ne 0) { throw 'Desktop Pet publish failed' }
          .\tests\SmokePet.ps1
      - name: Test synchronized lyrics timing
        shell: pwsh
        run: |
          dotnet run --project .\tests\LyricsTests\LyricsTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Lyrics timing tests failed' }
      - name: Test file review scans
        shell: pwsh
        run: |
          dotnet run --project .\tests\FileReviewTests\FileReviewTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'File review tests failed' }
      - name: Test cleanup schedule definition
        shell: pwsh
        run: |
          dotnet run --project .\tests\TaskSetupTests\TaskSetupTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Schedule definition tests failed' }
      - name: Test cleanup presets
        shell: pwsh
        run: |
          dotnet run --project .\tests\CleanupPresetsTests\CleanupPresetsTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Cleanup preset tests failed' }
