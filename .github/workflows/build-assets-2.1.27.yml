name: Build CacheTrim 2.1.27 assets

on:
  push:
    branches: ['release/v2.1.27']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Verify target release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v2.1.27" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $tag.object.sha -ne 'ec20e12a0f3b9c2bcf1e24a93fd1dd51e864ecf3' -or $tag.object.type -ne 'commit') { throw 'Tag does not point to the checked source.' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v2.1.27" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.draft -or -not $release.prerelease -or $release.assets.Count -ne 0) { throw 'Expected an empty pre-release.' }
      - name: Check out tested source
        uses: actions/checkout@v4
        with:
          ref: ec20e12a0f3b9c2bcf1e24a93fd1dd51e864ecf3

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Desktop Pet companion
        shell: powershell
        run: |
          dotnet publish .\companion\DesktopPet\DesktopPet.csproj -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -o .\dist\pet-publish
          if ($LASTEXITCODE -ne 0) { throw "Desktop Pet publish failed: $LASTEXITCODE" }
          Copy-Item .\dist\pet-publish\DesktopPet.exe .\dist\DesktopPet.exe -Force


      - name: Package standalone pet with offline voice model
        shell: powershell
        run: |
          $dir = '.\dist\voice-pack'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item .\dist\pet-publish\DesktopPet.exe $dir -Force
          Copy-Item .\dist\pet-publish\VoiceModel $dir -Recurse -Force
          $nugetRoot = if ($env:NUGET_PACKAGES) { $env:NUGET_PACKAGES } else { Join-Path $env:USERPROFILE '.nuget\packages' }
          $native = Join-Path $nugetRoot 'vosk\0.3.38\build\lib\win-x64'
          foreach ($name in @('libvosk.dll', 'libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll')) {
            $file = Join-Path $native $name
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing Vosk dependency: $name" }
            Copy-Item -LiteralPath $file -Destination $dir -Force
          }
          Compress-Archive -Path "$dir\*" -DestinationPath .\dist\DesktopPet-voice-pack.zip -Force
          $voiceHash = (Get-FileHash .\dist\DesktopPet-voice-pack.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path .\dist\DesktopPet-voice-pack.zip.sha256 -Value $voiceHash -NoNewline -Encoding ASCII

      - name: Publish self-contained WPF app
        shell: powershell
        run: |
          $petHash = (Get-FileHash .\dist\pet-publish\DesktopPet.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          dotnet publish .\wpf\CacheTrim.Wpf.csproj -c Release -r win-x64 -p:Platform=x64 -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false "-p:TrustedDesktopPetSha256=$petHash" -o .\dist\publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed: $LASTEXITCODE" }
          Copy-Item .\dist\publish\CacheTrim.exe .\dist\CacheTrim.exe -Force


      - name: Verify embedded pet integrity pin
        shell: powershell
        run: |
          $petHash = (Get-FileHash .\dist\DesktopPet.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $assembly = '.\wpf\obj\x64\Release\net10.0-windows10.0.19041.0\win-x64\CacheTrim.dll'
          dotnet run --project .\tests\BuildPinTests\BuildPinTests.csproj -c Release -- $assembly $petHash
          if ($LASTEXITCODE -ne 0) { throw 'App does not pin the released Desktop Pet' }
      - name: Create SHA-256 checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash .\dist\CacheTrim.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path .\dist\CacheTrim.exe.sha256 -Value $hash -NoNewline -Encoding ASCII
          $petHash = (Get-FileHash .\dist\DesktopPet.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path .\dist\DesktopPet.exe.sha256 -Value $petHash -NoNewline -Encoding ASCII

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          tag_name: v2.1.27
          prerelease: true
          files: |
            dist/CacheTrim.exe
            dist/CacheTrim.exe.sha256
            dist/DesktopPet.exe
            dist/DesktopPet.exe.sha256
            dist/DesktopPet-voice-pack.zip
            dist/DesktopPet-voice-pack.zip.sha256

      - name: Verify uploaded release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v2.1.27" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.prerelease) { throw 'Pre-release not found.' }
          $names = @('CacheTrim.exe','CacheTrim.exe.sha256','DesktopPet.exe','DesktopPet.exe.sha256','DesktopPet-voice-pack.zip','DesktopPet-voice-pack.zip.sha256')
          if ($release.assets.Count -ne $names.Count) { throw 'Unexpected release assets count.' }
          foreach ($name in $names) {
            $matches = @($release.assets | Where-Object { $_.name -ceq $name -and $_.state -eq 'uploaded' -and $_.size -gt 0 })
            if ($matches.Count -ne 1) { throw "Missing or duplicate asset: $name" }
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path 'dist' $name)).Hash.ToLowerInvariant()
            if ($matches[0].digest -ne "sha256:$hash") { throw "Digest mismatch: $name" }
          }
          foreach ($name in @('CacheTrim.exe','DesktopPet.exe','DesktopPet-voice-pack.zip')) {
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path 'dist' $name)).Hash.ToLowerInvariant()
            if ((Get-Content -Raw (Join-Path 'dist' ($name + '.sha256'))).Trim() -ne $hash) { throw "Checksum mismatch: $name" }
          }
